<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self' 'unsafe-inline'; script-src 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Itsuki</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font:14px/1.45 'Segoe UI',system-ui,sans-serif}
.shell{height:100%;width:100%;display:flex;align-items:flex-end;gap:10px;padding:8px}
.pet{width:178px;height:292px;flex:0 0 178px;border:0;background:transparent;padding:0;cursor:grab;touch-action:none;user-select:none}
.pet:active{cursor:grabbing}
.pet img{width:100%;height:100%;object-fit:contain;object-position:center bottom;pointer-events:none;user-select:none;filter:drop-shadow(0 8px 16px #0007)}
.dialog{align-self:flex-end;margin-bottom:28px;max-width:174px;min-width:145px;background:linear-gradient(145deg,#3a202aef,#211319f5);border:1px solid #87515e;border-radius:16px;padding:10px 12px 13px;box-shadow:0 12px 34px #0008;position:relative}
.dialog:before{content:'';position:absolute;left:-7px;bottom:22px;width:12px;height:12px;transform:rotate(45deg);background:#321c25;border-left:1px solid #87515e;border-bottom:1px solid #87515e}
.drag-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-3px -2px 8px;padding:2px 0 6px;border-bottom:1px solid #ffffff20;cursor:grab;user-select:none}
.brand{font-size:9px;letter-spacing:1.7px;color:#d9a8b4;font-weight:700}
.tools{display:flex;gap:4px}
.tools button{width:22px;height:22px;border:0;border-radius:7px;background:#ffffff14;color:#f7e8ec;cursor:pointer}
.status{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;color:#dba2b2;margin-bottom:5px}
.line{font-size:12px;line-height:1.55;color:#f7e8ec;min-height:44px;overflow-wrap:anywhere}
.footer{font-size:8px;letter-spacing:1px;color:#bc8b98;margin-top:8px}
</style>
</head>
<body>
<main class="shell">
  <button class="pet" id="itsukiPet" aria-label="Itsuki companion; drag to move">
    <img id="itsukiArt" alt="Itsuki" draggable="false">
  </button>
  <aside class="dialog">
    <header class="drag-head" id="dragHandle">
      <span class="brand">AURESTAR · ITSUKI</span>
      <span class="tools">
        <button id="openWorkspace" title="Open workspace" aria-label="Open workspace">↗</button>
        <button id="hideItsuki" title="Hide Itsuki (Alt)" aria-label="Hide Itsuki">−</button>
      </span>
    </header>
    <div class="status" id="itsukiStatus">STUDY COMPANION</div>
    <div class="line" id="itsukiLine">Your study plan is ready. Choose one clear task and take the first step.</div>
    <div class="footer">ONE STEP AT A TIME</div>
  </aside>
</main>
<script>const chrome=window.aurestarChrome;</script>
<script src="itsuki.js"></script>
</body>
</html>
