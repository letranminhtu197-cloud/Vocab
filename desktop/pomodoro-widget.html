<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurestar Pomodoro</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font:13px/1.4 'Segoe UI',system-ui,sans-serif}
.panel{height:100%;padding:13px 15px 12px;border:1px solid #8d5965;border-radius:18px;background:linear-gradient(145deg,#321d26f5,#1d1319f7);box-shadow:0 12px 36px #0008}
.head{display:flex;align-items:center;justify-content:space-between}
.brand{font-size:9px;letter-spacing:1.6px;font-weight:700;color:#d9a9b5}
.head button{border:0;background:#ffffff14;color:#f8e9ed;border-radius:7px;width:23px;height:23px;cursor:pointer}
.phase{font-size:10px;letter-spacing:1.4px;color:#d5a0ad;margin-top:10px;text-transform:uppercase}
.time{font-size:42px;line-height:1.1;font-weight:650;letter-spacing:1px;font-variant-numeric:tabular-nums;margin:1px 0}
.detail{font-size:10px;color:#c7aab1;min-height:15px}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.actions button{flex:1;min-width:72px;border:1px solid #80505d;background:#ffffff0d;color:#f8e9ed;border-radius:8px;padding:7px 5px;font-size:10px;cursor:pointer}
.actions button.primary{background:#884a5b;border-color:#a76678;color:#fff}
.actions button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<main class="panel">
  <header class="head"><span class="brand">AURESTAR · POMODORO</span><button id="close" aria-label="Close widget">×</button></header>
  <div class="phase" id="phase">FOCUS · READY</div>
  <div class="time" id="time">25:00</div>
  <div class="detail" id="detail">Focus session ready</div>
  <div class="actions">
    <button class="primary" id="toggle">Start</button>
    <button id="break">Start break</button>
    <button id="skip" hidden>Skip break</button>
    <button id="reset">Reset</button>
    <button id="stop">Stop</button>
  </div>
</main>
<script>const chrome=window.aurestarChrome;</script>
<script src="pomodoro-widget.js"></script>
</body>
</html>
