<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Aurestar</title><link rel="stylesheet" href="unlock.css"></head><body><main class="unlock-shell"><div class="star">★</div><p class="eyebrow">YOUR PRIVATE STUDY SPACE</p><h1 id="heading">Welcome to Aurestar</h1><p class="sub" id="subheading">Enter your password to open Aurestar.</p><form id="unlockForm" autocomplete="on"><label id="currentLabel" for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="Enter password"><div id="newFields" hidden><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Repeat password"><p class="hint">Use at least 8 characters. This password is stored as a salted PBKDF2 hash on this browser, not as plain text.</p></div><p id="error" class="error" role="alert" hidden></p><button id="submitBtn" type="submit">Unlock</button></form><button id="forgotBtn" class="link-button" type="button">Forgot password?</button><p class="foot">Local device lock · not a replacement for your Windows account security</p></main><script src="unlock.js"></script></body></html>
