<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurestar</title><link rel="stylesheet" href="styles.css"><style>
:root{color-scheme:dark;--wine-bg:#2b181e;--wine-deep:#231217;--wine-card:#3d222a;--wine-raised:#472832;--wine-line:#52313a;--wine-text:#f3e8eb;--wine-muted:#b89b9e;--wine-primary:#d94e67;--wine-pink:#f28b9c;--wine-star:#f6c555}
*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(ellipse at 75% 0,rgba(217,78,103,.1),transparent 35%),var(--wine-deep);color:var(--wine-text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.panel{display:grid;gap:12px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.head-brand{display:flex;align-items:center;gap:10px;min-width:0}.itsuki-panel-art{width:48px;height:60px;object-fit:contain;object-position:center bottom;flex:none;filter:drop-shadow(0 4px 8px rgba(217,78,103,.16))}.brand{font-weight:850;color:var(--wine-pink);letter-spacing:.01em}.muted{color:var(--wine-muted);font-size:12px}.card{min-width:0;background:linear-gradient(155deg,var(--wine-card),var(--wine-bg));border:1px solid var(--wine-line);border-radius:15px;padding:14px;box-shadow:0 8px 24px rgba(17,5,10,.16)}
.timer{font:750 44px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:-.05em;text-align:center;margin:16px 0;color:var(--wine-text);font-variant-numeric:tabular-nums}.actions,.modes{display:flex;gap:7px;flex-wrap:wrap}.actions button,.modes button,.open,.quick button{border:1px solid #70434f;border-radius:9px;padding:8px 10px;background:#321c24;color:#f2dce1;cursor:pointer;font:inherit;font-size:12px;transition:background .16s,border-color .16s}.actions button:hover,.modes button:hover,.open:hover,.quick button:hover{background:#512b38;border-color:#98606d}.actions .primary{background:linear-gradient(135deg,var(--wine-primary),#bf3b54);border-color:#e4778b;color:white;font-weight:850}.status{color:#f2b6c2;text-align:center;font-size:12px}.quick{display:flex;gap:7px;margin:10px 0}.quick input{min-width:0;flex:1;width:auto;background:#2b181e;color:var(--wine-text);border:1px solid var(--wine-line);border-radius:9px;padding:9px 10px;font:inherit;font-size:12px;outline:none}.quick input:focus{border-color:var(--wine-pink);box-shadow:0 0 0 3px rgba(217,78,103,.12)}.quick button{background:rgba(217,78,103,.13);border-color:rgba(242,139,156,.26);font-weight:800}.tasks{display:grid;gap:4px;max-height:320px;overflow:auto}.asc-sp-task{display:flex;gap:8px;border-bottom:1px solid rgba(242,139,156,.12);padding:9px 0}.asc-sp-task:last-child{border-bottom:0}.asc-sp-task-main{display:flex;flex:1;justify-content:space-between;gap:8px;text-align:left;border:0;background:transparent;color:inherit;min-width:0}.asc-sp-task-main span{display:grid;gap:4px;min-width:0}.asc-sp-task-main b{overflow-wrap:anywhere;font-size:12px}.asc-sp-task-main small{color:var(--wine-muted);font-size:11px}.asc-sp-check{border:1px solid #80505b;border-radius:7px;background:#2b181e;color:var(--wine-pink);flex:0 0 26px}.asc-sp-task.done b{text-decoration:line-through;color:#92727d}.error{color:#ff9aa6;background:rgba(255,107,124,.1);border:1px solid rgba(255,107,124,.2);padding:8px;border-radius:8px;font-size:12px}
:where(button,a,input):focus-visible{outline:2px solid var(--wine-pink);outline-offset:2px}
 .aurestar-brand{display:flex;align-items:center;gap:7px}.aurestar-star{font-size:20px;background:linear-gradient(145deg,#fff6b1,#ffd343 45%,#b26f08);background-clip:text;-webkit-background-clip:text;color:transparent;text-shadow:0 2px 10px #f5ad1226}
</style></head><body><main class="panel"><header class="head"><div class="head-brand"><img class="itsuki-panel-art" src="assets/itsuki/itsuki-pet.png" alt="Study companion"><div><div class="brand aurestar-brand"><span class="aurestar-star">★</span> Aurestar</div><div class="muted">Build focus. Make progress.</div></div></div><button id="sideOpenApp" class="open">Open app ↗</button></header><section class="card"><div class="head"><b>Focus</b><span id="sideWorkInterval" class="muted">25m</span></div><div id="sideTimerDisplay" class="timer">25:00</div><div id="sideTimerStatus" class="status">Ready</div><div class="modes" style="justify-content:center;margin:10px 0"><button data-focus-mode="15">15 min</button><button data-focus-mode="25">25 min</button><button data-focus-mode="45">45 min</button><button data-focus-mode="60">60 min</button></div><div class="actions"><button id="sideTimerStart" class="primary">▶ START</button><button id="sideTimerPause" disabled>Pause</button></div><div class="muted" style="margin-top:10px;text-align:center">Break: <span id="sideShortBreak">5m</span> · Long break: <span id="sideLongBreak">15m</span> every <span id="sideLongEvery">4</span> sessions</div><div id="sideError" class="error" hidden></div></section><section class="card"><div class="head"><b>Today's tasks</b><span id="sideSummary" class="muted">Loading…</span></div><form id="sideQuickAdd" class="quick"><input name="title" placeholder="Add a task…" required maxlength="160"><button type="submit">Add</button></form><div id="sideTasks" class="tasks"></div><div id="sideFocusTaskLabel" class="muted" style="margin-top:10px">No focus task selected</div></section></main><script src="sidepanel-guard.js"></script></body></html>
