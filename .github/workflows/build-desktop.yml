name: Build Aurestar Desktop
on:
  workflow_dispatch:
  push:
    branches: [desktop-rebuild]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm install
      - name: Package Windows app
        working-directory: desktop
        run: npm run dist
      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: Aurestar-Windows
          path: desktop/release/*
          if-no-files-found: error
          retention-days: 14
