name: Android build
on:
  push:
    branches: [main, implementation]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"
          accept-android-sdk-licenses: false
          packages: "platform-tools"
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: gradle test
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify APK and offline manifest
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ! grep -R 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/vocab-permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/vocab-permissions.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare versioned APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Vocab-1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vocab-1.0.0-debug-apk
          path: dist/Vocab-1.0.0-debug.apk
          if-no-files-found: error
